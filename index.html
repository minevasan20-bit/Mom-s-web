<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Rudravel Blouse Designing — ருத்ர வேல் | Madurai</title>
<meta name="description" content="Rudravel Blouse Designing by Karthika. Bridal blouses, aari work, designer and everyday blouses in Madurai, Tamil Nadu.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;0,700;1,500&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --p:#7A2E4A;--pd:#5A1F36;--pl:#9C4767;
  --g:#C9A227;--gl:#E8C96A;
  --cr:#FDF9F5;--bl:#F7E8EC;--ink:#2A1A21;--soft:#4A343D;--mut:#7A6B71;--line:#E8DCD5;
}
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:84px}
body{font-family:'Poppins',sans-serif;color:var(--soft);background:var(--cr);line-height:1.75;overflow-x:hidden;-webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:'Playfair Display',serif;line-height:1.15;color:var(--ink);letter-spacing:-.01em}
h1{font-size:clamp(2.3rem,8vw,4.2rem);line-height:1.05}
h2{font-size:clamp(1.8rem,5vw,2.7rem)}
h3{font-size:1.15rem}
a{color:inherit;text-decoration:none}
img,svg{display:block;max-width:100%}
button{font:inherit;cursor:pointer;border:none;background:none;color:inherit}
.wrap{max-width:1150px;margin:0 auto;padding:0 20px}
.sec{padding:72px 0}
.sec--bl{background:linear-gradient(180deg,var(--cr),var(--bl) 25%,var(--bl) 75%,var(--cr))}
.sec--dk{background:radial-gradient(circle at 15% 20%,rgba(201,162,39,.14),transparent 45%),linear-gradient(160deg,#4A192C,#2A1A21);color:rgba(255,255,255,.8)}
.sec--dk h2,.sec--dk h3{color:#fff}
.head{text-align:center;max-width:680px;margin:0 auto 48px}
.head p{color:var(--mut);font-weight:300;margin-top:14px}
.eyebrow{display:inline-block;font-size:.68rem;font-weight:600;letter-spacing:.26em;text-transform:uppercase;color:var(--g);margin-bottom:14px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;padding:15px 32px;font-size:.78rem;font-weight:600;letter-spacing:.09em;text-transform:uppercase;border-radius:999px;background:var(--p);color:#fff;border:1.5px solid var(--p);transition:.3s;box-shadow:0 4px 14px rgba(122,46,74,.18)}
.btn:hover{background:var(--g);border-color:var(--g);color:var(--ink);transform:translateY(-3px)}
.btn--gold{background:var(--g);border-color:var(--g);color:var(--ink)}
.btn--gold:hover{background:var(--p);border-color:var(--p);color:#fff}
.btn--ghost{background:transparent;color:var(--p);border-color:var(--pl);box-shadow:none}
.btn--ghost:hover{background:var(--p);color:#fff;border-color:var(--p)}

/* IMAGE BOX + FALLBACK */
.imgbox{position:relative;overflow:hidden;background:linear-gradient(150deg,#8B3655,#5A1F36 60%,#401528)}
.imgbox img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:1;transition:transform .6s}
.imgbox:hover img{transform:scale(1.05)}
.imgbox.fallback img{display:none}
.imgbox.fallback::after{content:attr(data-fallback);position:absolute;inset:0;display:grid;place-items:center;padding:20px;text-align:center;color:var(--gl);font-family:'Playfair Display',serif;font-size:1.1rem;font-weight:600;letter-spacing:.04em;background:repeating-linear-gradient(45deg,rgba(255,255,255,.06) 0 2px,transparent 2px 10px),radial-gradient(circle at 30% 25%,rgba(232,201,106,.22),transparent 45%),linear-gradient(150deg,#8B3655,#5A1F36)}

/* NAV & LOGO */
.nav{position:fixed;inset:0 0 auto 0;height:80px;display:flex;align-items:center;z-index:100;transition:.3s}
.nav.on{height:66px;background:rgba(253,249,245,.94);backdrop-filter:blur(14px);box-shadow:0 4px 26px rgba(42,26,33,.09)}
.nav .wrap{display:flex;align-items:center;justify-content:space-between;gap:16px;max-width:1300px;width:100%}
.brand{display:flex;align-items:center;gap:12px}
.brand i{width:46px;height:46px;border-radius:50%;background:linear-gradient(135deg,var(--p),var(--pd));display:flex;align-items:center;justify-content:center;flex:none;box-shadow:0 4px 10px rgba(122,46,74,.2)}
.brand b{font-family:'Playfair Display',serif;font-size:1.08rem;color:var(--ink);line-height:1.1;display:block}
.brand small{font-size:.55rem;letter-spacing:.16em;text-transform:uppercase;color:var(--g);font-weight:600;display:block;margin-top:2px}
.brand small .ta{font-family:'Poppins',sans-serif;letter-spacing:.06em;text-transform:none;font-size:.62rem}
.links{display:flex;gap:4px}
.links a{padding:9px 13px;font-size:.85rem;border-radius:999px;transition:.2s}
.links a:hover{color:var(--p);background:rgba(122,46,74,.06)}
.burger{display:none;flex-direction:column;gap:5px;width:44px;height:44px;align-items:center;justify-content:center;border-radius:50%;background:rgba(122,46,74,.08)}
.burger span{width:20px;height:2px;background:var(--p);border-radius:2px;transition:.3s}
.burger.x span:nth-child(1){transform:translateY(7px) rotate(45deg)}
.burger.x span:nth-child(2){opacity:0}
.burger.x span:nth-child(3){transform:translateY(-7px) rotate(-45deg)}

/* MOBILE MENU */
.mmenu{position:fixed;inset:0;z-index:99;background:linear-gradient(165deg,#5A1F36,#2A1A21);padding:100px 24px 40px;transform:translateX(100%);visibility:hidden;transition:.5s cubic-bezier(.65,0,.35,1);overflow-y:auto}
.mmenu.open{transform:none;visibility:visible}
.mmenu a{display:flex;gap:14px;align-items:baseline;padding:14px 0;font-family:'Playfair Display',serif;font-size:1.5rem;font-weight:600;color:#fff;border-bottom:1px solid rgba(255,255,255,.1)}
.mmenu a:hover{color:var(--gl)}
.mmenu a em{font-family:'Poppins',sans-serif;font-style:normal;font-size:.65rem;letter-spacing:.2em;color:var(--g)}
.mmenu p{color:rgba(255,255,255,.55);font-size:.7rem;letter-spacing:.2em;text-transform:uppercase;margin:32px 0 10px}
.mmenu .tel{color:var(--gl);font-size:1.1rem;font-weight:500}
.mmenu .ta{color:rgba(255,255,255,.7);font-size:.9rem;margin-top:4px;display:block}

/* HERO */
.hero{position:relative;min-height:100svh;display:flex;align-items:center;padding:120px 0 70px;overflow:hidden;background:radial-gradient(ellipse at 80% 15%,rgba(201,162,39,.18),transparent 52%),radial-gradient(ellipse at 10% 85%,rgba(185,116,143,.22),transparent 55%),linear-gradient(165deg,#FDF9F5,#F7E8EC 55%,#F3DDE3)}
.hero::before{content:"";position:absolute;width:560px;height:560px;border-radius:50%;border:1px solid rgba(122,46,74,.1);top:-200px;right:-180px}
.hero::after{content:"";position:absolute;width:380px;height:380px;border-radius:50%;border:1px dashed rgba(201,162,39,.3);bottom:-140px;left:-150px}
.hero .wrap{position:relative;z-index:2;display:grid;grid-template-columns:1.05fr .95fr;gap:50px;align-items:center}
.badge{display:inline-flex;align-items:center;gap:10px;padding:8px 18px 8px 8px;border-radius:999px;background:rgba(255,255,255,.8);border:1px solid rgba(201,162,39,.35);font-size:.66rem;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--pd);margin-bottom:26px}
.badge i{width:26px;height:26px;border-radius:50%;background:var(--g);display:grid;place-items:center;font-style:normal;font-size:.8rem;color:var(--ink)}
.badge .ta{letter-spacing:.04em;text-transform:none;font-size:.7rem;color:var(--p)}
.hero h1 em{font-style:italic;font-weight:500;background:linear-gradient(120deg,#C9A227,#E8C96A 40%,#A9861C);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.hero p.lead{font-size:1.05rem;font-weight:300;color:var(--mut);max-width:520px;margin:24px 0 32px}
.acts{display:flex;flex-wrap:wrap;gap:14px}
.trust{display:flex;flex-wrap:wrap;gap:28px;margin-top:38px;padding-top:28px;border-top:1px solid rgba(122,46,74,.13)}
.trust div b{display:block;font-family:'Playfair Display',serif;font-size:1.15rem;color:var(--ink);line-height:1.1}
.trust div span{font-size:.66rem;letter-spacing:.1em;text-transform:uppercase;color:var(--mut)}
.heroart{position:relative;display:grid;place-items:center}
.frame{position:relative;width:100%;max-width:360px;aspect-ratio:3/4;border-radius:180px 180px 24px 24px;box-shadow:0 30px 70px rgba(42,26,33,.28);animation:float 7s ease-in-out infinite;overflow:hidden;background:linear-gradient(150deg,#8B3655,#5A1F36)}
.frame::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 40%,rgba(42,26,33,.7));z-index:2}
.frame .fc{position:absolute;inset:auto 0 0 0;padding:26px;text-align:center;z-index:3}
.frame .fc .em{width:82px;height:82px;border-radius:50%;border:1px solid rgba(232,201,106,.55);display:grid;place-items:center;margin:0 auto 16px;font-size:1.7rem;color:var(--gl);background:rgba(255,255,255,.06)}
.frame .fc b{display:block;font-family:'Playfair Display',serif;font-size:1.3rem;color:#fff;font-weight:600;letter-spacing:.04em}
.frame .fc small{font-size:.6rem;letter-spacing:.3em;text-transform:uppercase;color:var(--gl)}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-14px)}}

/* ABOUT */
.about{display:grid;grid-template-columns:.95fr 1.05fr;gap:56px;align-items:center}
.photo{position:relative;aspect-ratio:4/5;border-radius:24px 160px 24px 24px;box-shadow:0 18px 48px rgba(42,26,33,.18);overflow:hidden}
.photo::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 45%,rgba(42,26,33,.78));z-index:2}
.photo .pc{position:absolute;inset:auto 0 0 0;padding:28px;z-index:3}
.photo q{font-family:'Playfair Display',serif;font-style:italic;font-size:1.15rem;line-height:1.6;color:#fff;quotes:none;display:block}
.photo q em{color:var(--gl);font-style:italic}
.photo small{display:block;font-size:.6rem;letter-spacing:.22em;text-transform:uppercase;color:var(--gl);font-weight:600;margin-top:12px}
.yrs{position:absolute;right:-14px;top:32px;width:110px;height:110px;border-radius:50%;background:var(--cr);border:1px solid var(--line);box-shadow:0 12px 34px rgba(42,26,33,.14);display:grid;place-content:center;text-align:center;z-index:4}
.yrs b{font-family:'Playfair Display',serif;font-size:1.9rem;line-height:1;background:linear-gradient(135deg,var(--p),var(--pl));-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.yrs span{font-size:.52rem;letter-spacing:.16em;text-transform:uppercase;color:var(--mut);font-weight:600}
.about h2{margin-bottom:20px}
.about .lead{font-family:'Playfair Display',serif;font-style:italic;font-size:1.15rem;color:var(--p);line-height:1.7;margin-bottom:18px}
.about p{color:var(--mut);font-weight:300;margin-bottom:16px}
.feats{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin:28px 0}
.feats b{display:block;font-size:.9rem;color:var(--ink);font-weight:600}
.feats span{font-size:.78rem;color:var(--mut);font-weight:300}
.feats i{display:block;width:32px;height:32px;border-radius:50%;background:rgba(122,46,74,.09);color:var(--p);display:grid;place-items:center;font-style:normal;font-size:.85rem;margin-bottom:8px}

/* STATS */
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.1);border-radius:18px;overflow:hidden}
.stats div{background:rgba(255,255,255,.04);padding:28px 12px;text-align:center}
.stats b{display:block;font-family:'Playfair Display',serif;font-size:clamp(1.7rem,4vw,2.5rem);color:var(--gl);line-height:1}
.stats span{font-size:.64rem;letter-spacing:.18em;text-transform:uppercase;color:rgba(255,255,255,.6)}

/* SERVICES */
.svc{display:grid;grid-template-columns:repeat(3,1fr);gap:22px}
.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:28px 24px;transition:.3s;position:relative;overflow:hidden}
.card::after{content:"";position:absolute;top:0;left:0;right:0;height:3px;background:linear-gradient(90deg,var(--g),var(--gl));transform:scaleX(0);transform-origin:left;transition:.5s}
.card:hover{transform:translateY(-7px);box-shadow:0 18px 44px rgba(42,26,33,.13);border-color:transparent}
.card:hover::after{transform:scaleX(1)}
.card i{display:grid;place-items:center;width:56px;height:56px;border-radius:16px;background:linear-gradient(145deg,rgba(122,46,74,.1),rgba(201,162,39,.15));font-style:normal;font-size:1.4rem;margin-bottom:18px}
.card p{font-size:.87rem;font-weight:300;color:var(--mut);margin:8px 0 18px;line-height:1.8}
.card .price{font-family:'Playfair Display',serif;font-weight:700;color:var(--p);font-size:1.05rem}
.card .price small{font-family:'Poppins',sans-serif;font-weight:400;font-size:.66rem;color:var(--mut)}

/* GALLERY */
.gal{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}
.tile{position:relative;aspect-ratio:4/5;border-radius:18px;overflow:hidden;cursor:pointer;box-shadow:0 4px 16px rgba(42,26,33,.1);transition:.35s}
.tile:hover{transform:translateY(-6px);box-shadow:0 18px 44px rgba(42,26,33,.2)}
.tile .ov{position:absolute;inset:0;background:linear-gradient(180deg,transparent 40%,rgba(42,26,33,.85));display:flex;flex-direction:column;justify-content:flex-end;padding:18px;opacity:0;transition:.35s;z-index:3}
.tile:hover .ov{opacity:1}
.tile .ov em{font-style:normal;align-self:flex-start;background:rgba(232,201,106,.95);color:var(--ink);font-size:.56rem;font-weight:700;letter-spacing:.16em;text-transform:uppercase;padding:4px 11px;border-radius:999px;margin-bottom:8px}
.tile .ov b{font-family:'Playfair Display',serif;font-size:1.05rem;color:#fff;font-weight:600}
.tile .ov small{font-size:.72rem;color:rgba(255,255,255,.7);font-weight:300}

/* PRICING */
.plans{display:grid;grid-template-columns:repeat(3,1fr);gap:22px}
.plan{background:#fff;border:1px solid var(--line);border-radius:18px;padding:30px 24px;display:flex;flex-direction:column;transition:.3s;position:relative}
.plan:hover{transform:translateY(-6px);box-shadow:0 18px 44px rgba(42,26,33,.13)}
.plan.hot{background:linear-gradient(165deg,#5A1F36,#2A1A21);border-color:transparent;box-shadow:0 18px 48px rgba(42,26,33,.26);transform:scale(1.03)}
.plan.hot:hover{transform:scale(1.03) translateY(-6px)}
.plan.hot h3,.plan.hot .amt{color:#fff}
.plan.hot p,.plan.hot li{color:rgba(255,255,255,.72)}
.plan .rib{position:absolute;top:-12px;left:50%;transform:translateX(-50%);background:linear-gradient(135deg,#E8C96A,#C9A227);color:var(--ink);font-size:.56rem;font-weight:700;letter-spacing:.18em;text-transform:uppercase;padding:5px 18px;border-radius:999px;white-space:nowrap}
.plan h3{text-align:center}
.plan .sub{text-align:center;font-size:.8rem;color:var(--mut);margin-bottom:20px}
.amt{font-family:'Playfair Display',serif;font-size:2.4rem;font-weight:800;color:var(--p);text-align:center;line-height:1}
.amt sup{font-size:.42em;top:-.9em;margin-right:1px}
.plan .per{text-align:center;font-size:.64rem;letter-spacing:.18em;text-transform:uppercase;color:var(--mut);margin:8px 0 20px}
.plan ul{list-style:none;display:flex;flex-direction:column;gap:10px;margin-bottom:24px;flex:1}
.plan li{font-size:.83rem;font-weight:300;color:var(--soft);display:flex;gap:9px;line-height:1.6}
.plan li::before{content:"✓";color:#2E7D5B;font-weight:700;flex:none}
.plan.hot li::before{color:var(--gl)}
.note{text-align:center;font-size:.83rem;color:var(--mut);font-weight:300;margin-top:26px}
.note b{color:var(--p)}

/* QUOTE */
.quote{max-width:720px;margin:0 auto;text-align:center;background:#fff;border:1px solid var(--line);border-radius:20px;padding:44px 30px 34px;position:relative;box-shadow:0 8px 26px rgba(42,26,33,.07)}
.quote::before{content:"“";position:absolute;top:4px;left:50%;transform:translateX(-50%);font-family:'Playfair Display',serif;font-size:5rem;line-height:1;color:rgba(201,162,39,.22)}
.quote .stars{color:var(--g);letter-spacing:3px;font-size:.85rem;margin-bottom:18px}
.quote p{font-family:'Playfair Display',serif;font-style:italic;font-size:clamp(1.05rem,2.4vw,1.35rem);line-height:1.75;color:var(--soft);margin-bottom:22px}
.quote .who{display:flex;align-items:center;justify-content:center;gap:12px}
.quote .who i{width:48px;height:48px;border-radius:50%;background:linear-gradient(140deg,#9C4767,#5A1F36);color:#fff;display:grid;place-items:center;font-family:'Playfair Display',serif;font-size:1.1rem;font-weight:700;font-style:normal;flex:none}
.quote .who b{display:block;font-family:'Playfair Display',serif;font-size:.98rem;color:var(--ink);line-height:1.2}
.quote .who small{font-size:.66rem;letter-spacing:.12em;text-transform:uppercase;color:var(--mut)}

/* CONTACT */
.ct{display:grid;grid-template-columns:repeat(3,1fr);gap:20px}
.ct .card{text-align:center}
.ct .card i{margin:0 auto 16px}
.ct .card b{display:block;color:var(--ink);font-family:'Playfair Display',serif;font-size:1.02rem;margin-bottom:4px}
.ct .card p{font-size:.82rem;margin:0 0 10px}
.ct .card a{color:var(--p);font-weight:500;font-size:.87rem;border-bottom:1px solid transparent;transition:.2s}
.ct .card a:hover{border-color:var(--p)}
.hours{max-width:400px;margin:34px auto 0;background:#fff;border:1px solid var(--line);border-radius:16px;padding:22px 24px}
.hours h3{text-align:center;font-size:1rem;margin-bottom:14px}
.hours div{display:flex;justify-content:space-between;gap:14px;font-size:.83rem;padding:7px 0;border-bottom:1px dashed var(--line)}
.hours div:last-child{border:none}
.hours span:first-child{font-weight:500;color:var(--soft)}
.hours span:last-child{color:var(--mut);font-weight:300}
.hours .closed span:last-child{color:#C0392B}

/* FOOTER */
footer{background:radial-gradient(circle at 88% 12%,rgba(201,162,39,.11),transparent 45%),linear-gradient(170deg,#2A1A21,#1A0F14);color:rgba(255,255,255,.62);padding:60px 0 0;position:relative}
footer::before{content:"";position:absolute;top:0;left:0;right:0;height:3px;background:linear-gradient(135deg,#E8C96A,#C9A227,#A9861C)}
.fgrid{display:grid;grid-template-columns:1.5fr 1fr 1.3fr;gap:36px;padding-bottom:44px}
.fgrid h4{font-family:'Playfair Display',serif;font-size:1rem;color:#fff;margin-bottom:18px;position:relative;padding-bottom:10px}
.fgrid h4::after{content:"";position:absolute;left:0;bottom:0;width:26px;height:2px;background:var(--g);border-radius:2px}
.fgrid p{font-size:.85rem;font-weight:300;line-height:1.85;max-width:320px;margin-bottom:16px}
.fgrid ul{list-style:none;display:flex;flex-direction:column;gap:10px}
.fgrid li a{font-size:.85rem;font-weight:300;transition:.2s;display:inline-block}
.fgrid li a:hover{color:var(--gl);transform:translateX(3px)}
.fbrand{display:flex;align-items:center;gap:12px;margin-bottom:18px}
.fbrand i{width:46px;height:46px;border-radius:50%;background:linear-gradient(135deg,var(--p),var(--pd));display:flex;align-items:center;justify-content:center;flex:none;box-shadow:0 4px 10px rgba(122,46,74,.2)}
.fbrand b{font-family:'Playfair Display',serif;font-size:1.1rem;color:#fff;line-height:1.1;display:block}
.fbrand small{font-size:.55rem;letter-spacing:.16em;text-transform:uppercase;color:var(--g);font-weight:600;display:block;margin-top:3px}
.fbot{border-top:1px solid rgba(255,255,255,.09);padding:20px 0;display:flex;justify-content:space-between;gap:14px;flex-wrap:wrap;font-size:.76rem;color:rgba(255,255,255,.42)}
.fbot a:hover{color:var(--gl)}

/* FLOATING */
.fabs{position:fixed;right:18px;bottom:18px;z-index:90;display:flex;flex-direction:column;gap:12px}
.fab{width:54px;height:54px;border-radius:50%;display:grid;place-items:center;box-shadow:0 10px 30px rgba(42,26,33,.24);font-size:1.3rem;transition:.3s;color:#fff}
.fab.wa{background:#25D366;position:relative}
.fab.wa::after{content:"";position:absolute;inset:0;border-radius:50%;border:2px solid #25D366;animation:ping 2.2s ease-out infinite}
@keyframes ping{0%{transform:scale(1);opacity:.8}100%{transform:scale(1.6);opacity:0}}
.fab.wa:hover{transform:scale(1.08) rotate(6deg)}
.fab.top{background:var(--p);color:var(--gl);opacity:0;visibility:hidden;transform:translateY(12px);font-size:1rem}
.fab.top.on{opacity:1;visibility:visible;transform:none}

/* REVEAL */
[data-rv]{opacity:0;transform:translateY(30px);transition:opacity .8s cubic-bezier(.4,0,.2,1),transform .8s cubi
